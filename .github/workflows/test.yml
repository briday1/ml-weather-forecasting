name: Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install script and test dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Check formatting
        run: python -m ruff format --check experiment.py scripts tests
      - name: Lint
        run: python -m ruff check experiment.py scripts tests
      - name: Test
        run: python -m pytest -q
